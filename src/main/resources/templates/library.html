<!DOCTYPE html>
<html lang="fi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Library</title>
</head>

<body>
    <a th:href="@{/frontpage}">Home</a>
    <a th:href="@{/library}">Library</a>
    <a th:href="@{/login}">Login</a>

    <a sec:authorize="isAuthenticated()" th:href="@{/userprofile}">My Profile</a>

    <form th:action="@{/logout}" method="post">
        <input type="submit" value="Sign Out" />
    </form>

    <h2>Game Library</h2>
    <input type="text" id="gameSearch" placeholder="Search games by name...">

    <table>
        <tr>
            <th>Name |</th>
            <th>Release Year |</th>
            <th>Developer |</th>
            <th>User Rating |</th>
            <th>Genre |</th>
            <th>Price |</th>
            <th>Platform</th>
            <th></th>

        </tr>
        <tr th:each="game : ${games}" th:attr="data-game-id=${game.id}">
            <td th:text="${game.name}"></td>
            <td th:text="${game.releaseYear}"></td>
            <td th:text="${game.developer}"></td>
            <td th:text="${game.rating}"></td>
            <td th:text="${game.genre.name}"></td>
            <td th:text="${game.price}"></td>
            <td><span th:each="platform : ${game.platforms}" th:text="${platform.name} + ' '"></span></td>

            <td sec:authorize="isAuthenticated()">
                <form th:action="@{/addtouserlibrary}" method="post">
                    <input type="hidden" name="gameId" th:value="${game.id}" />
                    <select name="statusId">
                        <option value="">Choose Status</option>
                        <option th:each="status : ${statuses}" th:value="${status.id}" th:text="${status.name}">
                        </option>
                    </select>
                    <button type="submit">Add to My Library</button>
                </form>
            </td>

            <td sec:authorize="hasAuthority('admin')"><a th:href="@{/edit/{id}(id=${game.id})}">Edit</a></td>
            <td sec:authorize="hasAuthority('admin')"><a th:href="@{/deletegame/{id}(id=${game.id})}">Delete</a></td>
        </tr>
    </table>
    <td sec:authorize="hasAuthority('admin')"><a th:href="@{/addgame}">Add Game</a></td>

    <script>
        fetch("/api/games")
        .then(response => response.json())
        .then(games => {

            const searchInput = document.getElementById("gameSearch");
            const gameRows = document.querySelectorAll("tr[data-game-id]");

            searchInput.addEventListener("input", function () {
                const searchTerm = this.value.toLowerCase();

                gameRows.forEach(row => {
                    const gameId = row.dataset.gameId;

                    const game = games.find(game => game.id == gameId);

                    const gameName = game.name.toLowerCase();

                    row.style.display = gameName.includes(searchTerm) ? "" : "none";
                });
            });
        });
    </script>
</body>

</html>
