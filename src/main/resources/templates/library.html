<!DOCTYPE html>
<html lang="fi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Library</title>
</head>
<body>
    <a th:href ="@{/frontpage}">Home</a>
    <p>| Library | Log In/Log out</p>
    <p>Categories | Platform | Raiting | Alphabet</p>

    <table>
        <tr>
            <th>Name |</th>
            <th>Release Year |</th>
            <th>Developer |</th>
            <th>User Rating |</th>
            <th>Genre |</th>
            <th>Price |</th>
            <th></th>

        </tr>
        <tr th:each = "game : ${games}">
            <td th:text="${game.name}"></td>
            <td th:text="${game.releaseYear}"></td>
            <td th:text="${game.developer}"></td>
            <td th:text="${game.rating}"></td>
            <td th:text="${game.genre.name}"></td>
            <td th:text="${game.price}"></td>
        </tr>
    </table>
</body>
</html>
