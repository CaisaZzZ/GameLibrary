<!DOCTYPE html>
<html lang="fi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Library</title>
</head>

<body>
    <a th:href ="@{/frontpage}">Home</a>
    <a th:href="@{/library}" >Library</a>
    <a th:href="@{/login}">Login</a>
    <a>Log out</a>

    <table>
        <tr>
            <th>Name |</th>
            <th>Release Year |</th>
            <th>Developer |</th>
            <th>User Rating |</th>
            <th>Genre |</th>
            <th>Price |</th>
            <th>Platform</th>
            <th></th>

        </tr>
        <tr th:each="game : ${games}">
            <td th:text="${game.name}"></td>
            <td th:text="${game.releaseYear}"></td>
            <td th:text="${game.developer}"></td>
            <td th:text="${game.rating}"></td>
            <td th:text="${game.genre.name}"></td>
            <td th:text="${game.price}"></td>
            <td><span th:each="platform : ${game.platforms}" th:text="${platform.name} + ' '"></span></td>

            <td><a th:href="@{/edit/{id}(id=${game.id})}">Edit</a></td>
            <td><a th:href="@{/deletegame/{id}(id=${game.id})}">Delete</a></td>
        </tr>
    </table>
    <a th:href="@{/addgame}">Add Game</a>
</body>

</html>
